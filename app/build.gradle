apply plugin: 'kotlin-android'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.appdistribution'
apply plugin: 'com.android.application'
apply plugin: 'com.github.triplet.play'

def isolatedBuildDir = providers.gradleProperty("easyNotebookBuildDir").orNull
if (isolatedBuildDir != null && !isolatedBuildDir.trim().isEmpty()) {
    buildDir = file(isolatedBuildDir)
}

def releaseStorePath = System.getenv("EASY_NOTEBOOK_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("EASY_NOTEBOOK_KEYSTORE_PASSWORD")
def releaseKeyPassword = System.getenv("EASY_NOTEBOOK_KEY_PASSWORD")
def releaseKeyAlias = System.getenv("EASY_NOTEBOOK_KEY_ALIAS") ?: "key_old_lake"
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains("bundlerelease") || normalized.contains("assemblerelease")
}

if (releaseTaskRequested && ([releaseStorePath, releaseStorePassword, releaseKeyPassword].any { value -> value == null || value.trim().isEmpty() })) {
    throw new GradleException("Release signing requires EASY_NOTEBOOK_KEYSTORE_PATH, EASY_NOTEBOOK_KEYSTORE_PASSWORD, and EASY_NOTEBOOK_KEY_PASSWORD")
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.notes.easynotebook"
        minSdkVersion 23
        targetSdk 36
        versionCode 32
        versionName "2.6.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding true
    }
    signingConfigs {
        release {
            if (releaseStorePath != null && !releaseStorePath.trim().isEmpty()) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.notes.easynotebook'

    play {
        def credsPath = System.getenv("GOOGLE_APPLICATION_CREDENTIALS") ?: "${project.projectDir}/play-credentials.json"
        serviceAccountCredentials.set(file(credsPath))
        defaultToAppBundles.set(true)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation platform('com.google.firebase:firebase-bom:30.1.0')
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'com.google.android.play:review:2.0.2'

}

apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
